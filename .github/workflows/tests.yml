name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Shared libs are current copies of lib/core (node scripts/sync-libs.mjs)
        run: node scripts/sync-libs.mjs --check
      - name: Python tests (every mods/*/tests with test_*.py)
        run: |
          for d in mods/*/tests; do
            if ls "$d"/test_*.py >/dev/null 2>&1; then
              echo "== $d"
              python -I -m unittest discover -s "$d" -p "test_*.py"
            fi
          done
      - name: Node tests (discovered, so new mods need no edit here)
        run: node --test --test-reporter=dot "tests/*.test.mjs" "mods/*/tests/*.test.mjs"
      - name: Validate every mod (claude plugin validate)
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.293 --no-fund --no-audit --loglevel=error
          node tools/validate_mods.mjs
      - name: Confidentiality scan
        run: python -I tools/confidentiality_scan.py .
